<script>
  function switchNavTab(btnEl, target) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    btnEl.classList.add('active');

    if (typeof switchPage === 'function') {
      switchPage(target, btnEl);
    }
  }
</script>
