<svg xmlns="http://www.w3.org/2000/svg" width="124" height="124" viewBox="0 0 124 124">
  <defs>
    <path id="tri" d="M42.8,29.4 L81.2,48.6 Q108,62 81.2,75.4 L42.8,94.6 Q16,108 16,78 L16,46 Q16,16 42.8,29.4 Z"/>
    <clipPath id="clip"><use href="#tri"/></clipPath>

    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="16" y1="30" x2="108" y2="82">
      <stop offset="0" stop-color="#4a2ad8"/>
      <stop offset="0.30" stop-color="#6f33ec"/>
      <stop offset="0.55" stop-color="#9b39f0"/>
      <stop offset="0.75" stop-color="#c844f8"/>
      <stop offset="0.90" stop-color="#ec5cff"/>
      <stop offset="1" stop-color="#ff86ea"/>
    </linearGradient>

    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="110">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#160033" stop-opacity="0.30"/>
    </linearGradient>

    <radialGradient id="spec" gradientUnits="userSpaceOnUse" cx="34" cy="30" r="36">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#e9ddff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" gradientUnits="userSpaceOnUse" cx="94" cy="62" r="34">
      <stop offset="0" stop-color="#ffd6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="facetLight" gradientUnits="userSpaceOnUse" cx="66" cy="42" r="48">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lens" gradientUnits="userSpaceOnUse" cx="52" cy="84" r="42">
      <stop offset="0" stop-color="#1c0640" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#2a0a55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a0a55" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="108" y2="92">
      <stop offset="0" stop-color="#e9dcff"/>
      <stop offset="0.22" stop-color="#9a6cff"/>
      <stop offset="0.5" stop-color="#b14dff"/>
      <stop offset="0.8" stop-color="#ff45f0"/>
      <stop offset="1" stop-color="#ff7ae8"/>
    </linearGradient>

    <linearGradient id="rimHi" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="108" y2="92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#ffe0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Full white square background -->
  <rect width="124" height="124" fill="#ffffff"/>

  <!-- Outer neon glow -->
  <use href="#tri" fill="none" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" opacity="0.85"/>

  <!-- Glass body and optical layers -->
  <g clip-path="url(#clip)">
    <use href="#tri" fill="url(#body)"/>
    <use href="#tri" fill="url(#shade)"/>
    <ellipse cx="66" cy="42" rx="50" ry="32" fill="url(#facetLight)"/>
    <ellipse cx="52" cy="84" rx="44" ry="34" fill="url(#lens)"/>
    <circle cx="94" cy="62" r="34" fill="url(#rightGlow)"/>
    <ellipse cx="34" cy="30" rx="34" ry="30" fill="url(#spec)"/>
  </g>

  <!-- Glass tube rim -->
  <use href="#tri" fill="none" stroke="url(#rim)" stroke-width="5.5" stroke-linejoin="round"/>
  <use href="#tri" fill="none" stroke="url(#rimHi)" stroke-width="1.6" stroke-linejoin="round"/>
</svg>