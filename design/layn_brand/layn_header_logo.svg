<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 128" role="img" aria-label="LAYN play logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Outer thin border -->
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="108" y1="500" x2="1158" y2="700">
      <stop offset="0" stop-color="#5a2ae8"/>
      <stop offset="0.5" stop-color="#7a1cf5"/>
      <stop offset="0.85" stop-color="#b02cff"/>
      <stop offset="1" stop-color="#e040ff"/>
    </linearGradient>

    <!-- Lower right: violet to pink -->
    <linearGradient id="rightBase" gradientUnits="userSpaceOnUse" x1="640" y1="700" x2="1130" y2="640">
      <stop offset="0" stop-color="#5c10cc"/>
      <stop offset="0.3" stop-color="#8412f2"/>
      <stop offset="0.6" stop-color="#b028ff"/>
      <stop offset="1" stop-color="#f27cff"/>
    </linearGradient>
    <radialGradient id="bottomMagenta" gradientUnits="userSpaceOnUse" cx="720" cy="1000" r="300">
      <stop offset="0" stop-color="#c020ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c020ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Upper right lilac zone -->
    <linearGradient id="topRight" gradientUnits="userSpaceOnUse" x1="700" y1="250" x2="880" y2="540">
      <stop offset="0" stop-color="#e2b4ff"/>
      <stop offset="0.5" stop-color="#bc72ff"/>
      <stop offset="1" stop-color="#a44cf5"/>
    </linearGradient>
    <linearGradient id="topRightTip" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="1120" y2="0">
      <stop offset="0" stop-color="#ffb8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb0ff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Left upper blue-violet zone -->
    <linearGradient id="leftUpper" gradientUnits="userSpaceOnUse" x1="170" y1="250" x2="640" y2="620">
      <stop offset="0" stop-color="#8a80ff"/>
      <stop offset="0.25" stop-color="#6a4cf5"/>
      <stop offset="0.6" stop-color="#4e22c0"/>
      <stop offset="1" stop-color="#2c1085"/>
    </linearGradient>
    <linearGradient id="leftUpperRight" gradientUnits="userSpaceOnUse" x1="400" y1="150" x2="660" y2="480">
      <stop offset="0" stop-color="#a070f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6420b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftEdgeBlue" gradientUnits="userSpaceOnUse" x1="135" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#6a3cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6a3cff" stop-opacity="0"/>
    </linearGradient>

    <!-- Dark lower-left lens -->
    <radialGradient id="darkLens" gradientUnits="userSpaceOnUse" cx="390" cy="820" r="340">
      <stop offset="0" stop-color="#140840"/>
      <stop offset="0.55" stop-color="#2a0a78"/>
      <stop offset="1" stop-color="#5518d8"/>
    </radialGradient>

    <!-- Glows -->
    <radialGradient id="glossTL" gradientUnits="userSpaceOnUse" cx="260" cy="220" r="200">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#e0d4ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c8b8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tipGlow" gradientUnits="userSpaceOnUse" cx="1080" cy="630" r="150">
      <stop offset="0" stop-color="#ffc0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffc0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimFadeLeft" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="1000">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d4c8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b8a8ff" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="borderLight" gradientUnits="userSpaceOnUse" x1="108" y1="400" x2="1158" y2="800">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.5" stop-color="#a95cff"/>
      <stop offset="1" stop-color="#f27cff"/>
    </linearGradient>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="outerClip"><path d="M108 929 L108 323 A215 215 0 0 1 430.5 136.8 L1090.3 517.8 A125 125 0 0 1 1090.3 734.2 L430.5 1115.2 A215 215 0 0 1 108 929 Z"/></clipPath>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>

    <path id="innerShape" d="M136 929 L136 323 A187 187 0 0 1 416.5 161 L1076.3 542 A97 97 0 0 1 1076.3 710 L416.5 1091 A187 187 0 0 1 136 929 Z"/>
    <clipPath id="clip"><use href="#innerShape"/></clipPath>
  
    <g id="letters" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 30 V100 H62"/>
      <path d="M96 100 L130 30 L164 100 M108 77 H152"/>
      <path d="M186 30 L216 68 L246 30 M216 68 V100"/>
      <path d="M278 100 V30 L338 100 V30"/>
    </g>
    <linearGradient id="wordBase" gradientUnits="userSpaceOnUse" x1="10" y1="30" x2="348" y2="100">
      <stop offset="0" stop-color="#4a24d8"/>
      <stop offset="0.5" stop-color="#7a1cf0"/>
      <stop offset="1" stop-color="#b52cff"/>
    </linearGradient>
    <linearGradient id="wordLight" gradientUnits="userSpaceOnUse" x1="10" y1="30" x2="348" y2="100">
      <stop offset="0" stop-color="#8f86ff"/>
      <stop offset="0.5" stop-color="#b070ff"/>
      <stop offset="1" stop-color="#f08cff"/>
    </linearGradient>
    <filter id="wordBlur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="wordShadow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

  <!-- LAYN wordmark: drawn as paths, no font needed -->
  <use href="#letters" stroke="#3a1090" stroke-opacity="0.45" stroke-width="24" filter="url(#wordShadow)" transform="translate(0 6)"/>
  <use href="#letters" stroke="#ffffff" stroke-opacity="0.9" stroke-width="28"/>
  <use href="#letters" stroke="url(#wordBase)" stroke-width="22"/>
  <use href="#letters" stroke="url(#wordLight)" stroke-width="11" filter="url(#wordBlur)"/>
  <use href="#letters" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" filter="url(#wordBlur)" transform="translate(0 -3)"/>

  <!-- Play icon -->
  <g transform="translate(357.2 -2.2) scale(0.106)">


  <!-- Outer thin border with white halo -->
  <path d="M108 929 L108 323 A215 215 0 0 1 430.5 136.8 L1090.3 517.8 A125 125 0 0 1 1090.3 734.2 L430.5 1115.2 A215 215 0 0 1 108 929 Z"
        fill="#ffffff" stroke="url(#border)" stroke-width="30" stroke-linejoin="round"/>

  <!-- Soft purple inner shadow (clipped, never leaks outside) -->
  <path d="M108 929 L108 323 A215 215 0 0 1 430.5 136.8 L1090.3 517.8 A125 125 0 0 1 1090.3 734.2 L430.5 1115.2 A215 215 0 0 1 108 929 Z" fill="none" stroke="#6a22d8" stroke-opacity="0.45" stroke-width="34" filter="url(#blur6)" clip-path="url(#outerClip)"/>

  <!-- 3D tube highlights on the border -->
  <path d="M108 929 L108 323 A215 215 0 0 1 430.5 136.8 L1090.3 517.8 A125 125 0 0 1 1090.3 734.2 L430.5 1115.2 A215 215 0 0 1 108 929 Z" fill="none" stroke="url(#borderLight)" stroke-width="16" stroke-linejoin="round" filter="url(#blur2)"/>
  <path d="M108 929 L108 323 A215 215 0 0 1 430.5 136.8 L1090.3 517.8 A125 125 0 0 1 1090.3 734.2 L430.5 1115.2 A215 215 0 0 1 108 929 Z" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3.5" stroke-linejoin="round" filter="url(#blur2)"/>

  <g clip-path="url(#clip)">
    <!-- Base right -->
    <rect x="100" y="100" width="1100" height="1100" fill="url(#rightBase)"/>
    <rect x="100" y="100" width="1100" height="1100" fill="url(#bottomMagenta)"/>

    <!-- Upper right lilac zone (above curve 2, right of curve 1) -->
    <path d="M400 130 C560 300 665 430 665 565 C780 525 900 505 1010 505 L1180 560 L1180 100 Z" fill="url(#topRight)"/>
    <path d="M400 130 C560 300 665 430 665 565 C780 525 900 505 1010 505 L1180 560 L1180 100 Z" fill="url(#topRightTip)"/>

    <!-- Left upper zone -->
    <path d="M100 100 L400 130 C560 300 665 430 665 565 C450 620 250 760 135 930 L100 930 Z" fill="url(#leftUpper)"/>
    <path d="M100 100 L400 130 C560 300 665 430 665 565 L500 620 L300 300 Z" fill="url(#leftUpperRight)"/>
    <rect x="135" y="150" width="200" height="800" fill="url(#leftEdgeBlue)"/>

    <!-- Dark lower-left lens -->
    <path d="M135 940 C250 760 450 630 665 565 C672 720 600 900 420 1100 L100 1150 Z" fill="url(#darkLens)"/>

    <!-- Soft light along top edge -->
    <path d="M416.5 161 L1076.3 542" stroke="#ffffff" stroke-opacity="0.55" stroke-width="26" fill="none" filter="url(#blur10)"/>
    <!-- Light along left edge (fades downward) -->
    <path d="M136 929 L136 323 A187 187 0 0 1 323 136" stroke="url(#rimFadeLeft)" stroke-width="30" fill="none" filter="url(#blur10)"/>
    <!-- Light along bottom edge -->
    <path d="M1076.3 710 L416.5 1091 A187 187 0 0 1 136 929" stroke="#d8c4ff" stroke-opacity="0.55" stroke-width="22" fill="none" filter="url(#blur10)"/>
    <!-- Pink glow at tip -->
    <circle cx="1080" cy="630" r="150" fill="url(#tipGlow)"/>

    <!-- Curve edges (subtle light lines) -->
    <path d="M400 130 C560 300 665 430 665 565 C672 720 600 900 420 1100" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" fill="none" filter="url(#blur3)"/>
    <path d="M135 940 C250 760 450 630 665 565 C780 525 900 505 1010 505" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" fill="none" filter="url(#blur3)"/>

    <!-- Top-left gloss: radial + crescent -->
    <ellipse cx="262" cy="222" rx="205" ry="135" fill="url(#glossTL)" transform="rotate(-28 262 222)"/>
    <path d="M168 340 C160 215 235 160 350 158 C290 192 248 255 234 350 Z" fill="#ffffff" fill-opacity="0.65" filter="url(#blur3)"/>

    <!-- Bottom-left crescent reflection -->
    <path d="M149 929 A174 174 0 0 0 300 1102 Q210 1040 172 929 Z" fill="#ffffff" fill-opacity="0.3" filter="url(#blur3)"/>
  </g>

  <!-- Second faint inner rim -->
  <path d="M150 929 L150 323 A173 173 0 0 1 409.5 173.2 L1069.3 554.1 A83 83 0 0 1 1069.3 697.9 L409.5 1078.8 A173 173 0 0 1 150 929 Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- White inner rim -->
  <use href="#innerShape" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="9"/>

  </g>
</svg>
